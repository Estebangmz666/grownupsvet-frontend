name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Instalar dependencias (lockfile)
        run: npm ci

      - name: Verificar tipos, lint y pruebas
        run: npm run check

      - name: Empaquetar la vista web
        run: npm run web:build

      - name: Publicar el bundle web
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
